<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jìyì – Chinese flashcards</title>
<meta name="theme-color" content="#EEF2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1322" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jìyì">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded without blocking: if Google Fonts is unreachable (e.g. in mainland China), the built-in fonts are used. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  --paper:#EEF2F7; --surface:#FFFFFF; --ink:#16213A; --muted:#5C6982; --line:#D6DEEA; --line-soft:#E4E9F2;
  --cobalt:#28479A; --cobalt-ink:#FFFFFF; --cobalt-soft:#E1E8F7; --grid:#A9BBDF; --grid-strong:#7790C8;
  --again:#A9372D; --again-soft:#F6E3E0; --hard:#865710; --hard-soft:#F3E8D3; --good:#28479A; --good-soft:#E1E8F7; --easy:#246B50; --easy-soft:#DCEDE5;
  --t1:#C23B2E; --t2:#B86F08; --t3:#23804F; --t4:#2A5BC0; --t5:#7A8599;
  --glaze:rgba(40,71,154,.32);
  --han:"Noto Serif SC","Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC",serif;
  --ui:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C1322; --surface:#131C30; --ink:#E5EBF6; --muted:#97A3BA; --line:#27334B; --line-soft:#1D2740;
    --cobalt:#8EA8EE; --cobalt-ink:#0C1322; --cobalt-soft:#1D2A4A; --grid:#33467A; --grid-strong:#4E66A6;
    --again:#F08C80; --again-soft:#3A2024; --hard:#E5B567; --hard-soft:#352A17; --good:#8EA8EE; --good-soft:#1D2A4A; --easy:#7FD1AC; --easy-soft:#16322A;
    --t1:#F2847A; --t2:#F0B45A; --t3:#6FD198; --t4:#86A9F7; --t5:#8D98AD;
    --glaze:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1322; --surface:#131C30; --ink:#E5EBF6; --muted:#97A3BA; --line:#27334B; --line-soft:#1D2740;
  --cobalt:#8EA8EE; --cobalt-ink:#0C1322; --cobalt-soft:#1D2A4A; --grid:#33467A; --grid-strong:#4E66A6;
  --again:#F08C80; --again-soft:#3A2024; --hard:#E5B567; --hard-soft:#352A17; --good:#8EA8EE; --good-soft:#1D2A4A; --easy:#7FD1AC; --easy-soft:#16322A;
  --t1:#F2847A; --t2:#F0B45A; --t3:#6FD198; --t4:#86A9F7; --t5:#8D98AD;
  --glaze:rgba(0,0,0,.55);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--paper);-webkit-text-size-adjust:100%}
body{height:100%;display:flex;flex-direction:column;overflow:hidden;margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.5}
:focus-visible{outline:2.5px solid var(--cobalt);outline-offset:2px}
p{margin:0}
[hidden]{display:none !important}

.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.top{flex:none;width:100%;max-width:560px;margin:0 auto;padding:12px 18px 4px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:.01em}
.seal{width:30px;height:30px;border-radius:8px;background:var(--cobalt);color:var(--cobalt-ink);display:grid;place-items:center;font-family:var(--han);font-weight:600;font-size:18px;line-height:1}
.icon-btn{width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.icon-btn[aria-current="page"]{color:var(--cobalt)}
.icon-btn svg{width:22px;height:22px}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-bottom:28px}
.view{padding-top:6px}

.h1{font-size:24px;line-height:1.25;font-weight:600;margin:6px 0 16px;letter-spacing:-.005em}
.h2{font-size:17px;font-weight:600;margin:0 0 12px}
.sub{font-size:14px;font-weight:600;color:var(--muted);margin:0 0 4px;text-align:left}
.muted{color:var(--muted)}

/* counts */
.counts{display:flex;align-items:baseline;gap:16px;font-size:14px;color:var(--muted);margin:2px 0 12px;min-height:28px}
.counts b{font-size:17px;font-weight:600;margin-right:3px}
.c-new{color:var(--cobalt)} .c-learn{color:var(--again)} .c-rev{color:var(--easy)}
.counts .undo{margin-left:auto}

/* study card */
.study-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px 20px 26px;min-height:min(52vh,430px);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 22px 44px -30px var(--glaze)}
.study-card[data-act]{cursor:pointer}
.study-card.is-back{justify-content:flex-start}
.badge{position:absolute;top:14px;left:16px;font-size:12.5px;font-weight:600;color:var(--cobalt);background:var(--cobalt-soft);padding:2px 9px;border-radius:999px}
.badge.relearn{color:var(--again);background:var(--again-soft)}
.tap-hint{margin-top:26px;font-size:14px;color:var(--muted)}

.tzg{display:flex;justify-content:center;gap:8px;flex-wrap:nowrap}
.cell{--c:min(128px,calc((min(100vw,560px) - 84px - (var(--n) - 1) * 8px) / var(--n)));width:var(--c);height:var(--c);position:relative;border:1.5px solid var(--grid-strong);display:grid;place-items:center;font-family:var(--han);font-weight:600;font-size:calc(var(--c) * .72);line-height:1;color:var(--ink)}
.cell svg{position:absolute;inset:0;width:100%;height:100%;color:var(--grid);pointer-events:none}
.cell > span{position:relative;transform:translateY(-.02em)}
.cell.faint{color:var(--grid-strong)}
.han-plain{font-family:var(--han);font-weight:600;font-size:clamp(30px,9vw,46px);line-height:1.35;text-align:center;word-break:break-word}
.t1{color:var(--t1)} .t2{color:var(--t2)} .t3{color:var(--t3)} .t4{color:var(--t4)} .t5{color:var(--t5)}

.answer{width:100%;margin-top:20px;text-align:center}
.answer.rise{animation:rise .3s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.answer.rise{animation:none}}
.py{font-size:25px;font-weight:500;letter-spacing:.01em;line-height:1.35}
.en{font-size:19px;margin-top:10px;line-height:1.4}
.notes{font-size:15px;color:var(--muted);margin-top:10px;white-space:pre-wrap}
.audio-row{display:flex;gap:8px;justify-content:center;margin-top:12px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px 7px 12px;font-size:14.5px;font-weight:500;display:inline-flex;gap:6px;align-items:center;min-height:38px}
.pill svg{width:15px;height:15px;color:var(--cobalt)}
.pill.playing,.chip.playing,.square.playing{border-color:var(--cobalt);color:var(--cobalt);background:var(--cobalt-soft)}
.ex-wrap{margin-top:24px;text-align:left}
.ex-view{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line-soft)}
.ex-zh{font-family:var(--han);font-size:21px;font-weight:500;line-height:1.5}
.ex-zh mark{background:none;color:var(--cobalt);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.ex-py{color:var(--muted);font-size:14.5px;margin-top:2px}
.ex-en{font-size:15px;margin-top:2px}
.ex-btns{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:44px;min-height:36px;padding:0 10px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.chip svg{width:14px;height:14px;color:var(--cobalt)}
.card-tools{display:flex;justify-content:center;margin-top:10px}

/* dock */
.dock{flex:none;position:relative;z-index:20;background:var(--paper);border-top:1px solid var(--line)}
.actions{max-width:560px;margin:0 auto;padding:10px 18px 2px}
.actions:empty{display:none}
.tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:2px 8px 4px}
.tab{background:none;border:0;color:var(--muted);font-size:11.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;min-height:50px}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--cobalt)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--cobalt);color:var(--cobalt-ink);font-size:17px;font-weight:600}
.btn.secondary{background:var(--cobalt-soft);color:var(--cobalt)}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate{border:0;border-radius:14px;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:15.5px;font-weight:600;line-height:1.25}
.rate small{font-size:12.5px;font-weight:500;opacity:.85}
.rate.g1{background:var(--again-soft);color:var(--again)}
.rate.g2{background:var(--hard-soft);color:var(--hard)}
.rate.g3{background:var(--good-soft);color:var(--good)}
.rate.g4{background:var(--easy-soft);color:var(--easy)}
.link{background:none;border:0;padding:8px 4px;color:var(--cobalt);font-size:15px;font-weight:500}
.link.strong{font-weight:600}
.link.danger{color:var(--again)}

/* empty states */
.empty{text-align:center;padding:28px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .h1{margin:10px 0 0}
.empty p{color:var(--muted);max-width:34ch}
.empty .btn{max-width:320px;margin-top:6px}
.empty .cell{--c:84px}

/* forms */
.form{display:block}
.field{display:block;margin-bottom:18px}
.lbl{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.opt{font-weight:400;color:var(--muted)}
.in{display:block;width:100%;font-family:var(--ui);font-size:17px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;-webkit-appearance:none;appearance:none;line-height:1.4}
.in::placeholder{color:var(--muted);opacity:.7}
.in:focus{outline:none;border-color:var(--cobalt);box-shadow:0 0 0 3px var(--cobalt-soft)}
textarea.in{resize:vertical;min-height:48px}
.in-han{font-family:var(--han);font-size:30px;font-weight:500;padding:8px 14px}
.in-han-sm{font-family:var(--han);font-size:20px;font-weight:500}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.hint{display:block;font-size:13.5px;color:var(--muted);margin-top:6px}
.field-msg{font-size:14px;margin-top:6px;color:var(--again)}
.field-msg.note{color:var(--muted)}
.field-msg .link{padding:0 2px;font-size:14px}
.with-btn{display:flex;gap:8px;align-items:stretch}
.square{flex:none;width:54px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.square svg{width:18px;height:18px;color:var(--cobalt)}
.ex-list{display:grid;gap:14px;margin-bottom:6px}
.ex{border-left:3px solid var(--grid);padding:2px 0 2px 12px;display:grid;gap:8px}
.ex-row{display:flex;gap:8px;align-items:stretch}
.ex-row textarea{flex:1}
.ex-row .ex-btns{width:62px}
.ex .link.danger{justify-self:start;padding:2px 0;font-size:14px}
.ghost{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--grid-strong);background:none;border-radius:12px;padding:10px 14px;color:var(--cobalt);font-size:15px;font-weight:500;min-height:44px}
.ghost svg{width:16px;height:16px}
.save-row{margin-top:6px}

/* card list */
.search{margin-bottom:6px}
.list{display:block}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line-soft);padding:12px 2px;min-height:64px}
.rh{font-family:var(--han);font-size:25px;font-weight:600;line-height:1.2;min-width:2em;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm{min-width:0}
.rp,.re{display:block}
.rp{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.re{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:13px;color:var(--muted);white-space:nowrap}
.rs.due{color:var(--cobalt);font-weight:600}
.list-note{font-size:14px;color:var(--muted);padding:14px 2px}

/* stats */
.kv{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-bottom:26px}
.kv > div{padding:14px 2px;border-bottom:1px solid var(--line)}
.kv > div:nth-child(odd){border-right:1px solid var(--line);padding-right:12px}
.kv > div:nth-child(even){padding-left:16px}
.kv b{display:block;font-size:28px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.kv span{font-size:14px;color:var(--muted)}
.stat-sec{margin-bottom:28px}
.meter{height:10px;border-radius:5px;background:var(--line-soft);overflow:hidden;margin:8px 0 6px}
.meter > i{display:block;height:100%;background:var(--cobalt);border-radius:5px}
.big{font-size:22px;font-weight:600}
.fc{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:130px;padding-top:18px}
.fc .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.fc .bar{width:100%;background:var(--cobalt);border-radius:4px 4px 1px 1px;min-height:2px}
.fc .bar.zero{background:var(--line)}
.fc .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.fc-days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line-soft);margin:6px 0 10px}
.stack i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:14px}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.k-new{background:var(--grid)} .k-learn{background:var(--again)} .k-young{background:var(--easy)} .k-mature{background:var(--cobalt)}

/* options */
.opt-sec{padding:4px 0 22px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.opt-sec:last-child{border-bottom:0}
.opt-sec p{font-size:15px;color:var(--muted);margin-bottom:12px;max-width:62ch}
.switch{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;font-size:16px;cursor:pointer}
.switch input{-webkit-appearance:none;appearance:none;flex:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .15s;cursor:pointer;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked{background:var(--cobalt)}
.switch input:checked::after{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:var(--cobalt);margin:6px 0}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .in{width:90px;text-align:center}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;color:var(--cobalt)}
.tone-sample{font-size:20px;font-weight:500;margin:4px 0 6px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{width:auto;flex:1;min-width:140px;font-size:16px;min-height:48px}
.backup-box{margin-top:14px}
.backup-box textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;height:140px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}
.sheet-head{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 6px) 12px 6px;background:var(--paper);border-bottom:1px solid var(--line)}
.sheet-head strong{font-size:16px;font-weight:600}
.sheet-head .link:last-child{justify-self:end}
.sheet-head .link:first-child{justify-self:start}
.sheet-body{padding-top:18px}
.sched-info{font-size:14px;color:var(--muted);margin:4px 0 18px;padding:12px 14px;border-radius:12px;background:var(--cobalt-soft)}
.danger-zone{display:flex;justify-content:space-between;gap:12px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}

.toast{position:fixed;left:50%;bottom:calc(var(--dock-h,120px) + env(safe-area-inset-bottom,0px) + 14px);transform:translate(-50%,8px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:60;max-width:calc(100% - 36px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sheet-open .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}

.top-actions{display:flex;align-items:center;gap:2px}
#sync-btn{color:var(--muted)}
#sync-btn .m-ok,#sync-btn .m-err{display:none}
#sync-btn[data-state="idle"] .m-ok{display:inline}
#sync-btn[data-state="error"]{color:var(--again)}
#sync-btn[data-state="error"] .m-err{display:inline}
#sync-btn[data-state="syncing"]{color:var(--cobalt)}
#sync-btn[data-state="syncing"] svg{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){#sync-btn[data-state="syncing"] svg{animation:none}}
.status{font-size:14.5px;color:var(--muted);margin:2px 0 12px}
.status:empty{display:none}
.status.err{color:var(--again)}
.status.ok{color:var(--easy)}

/* folders */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 10px;padding:2px 18px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:14.5px;font-weight:500;white-space:nowrap;min-height:38px}
.fchip b{font-weight:600;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.fchip svg{width:14px;height:14px}
.fchip[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt);color:var(--cobalt-ink)}
.fchip[aria-pressed="true"] b{color:inherit;opacity:.8}
.fchip.add{border-style:dashed;border-color:var(--grid-strong);color:var(--cobalt)}
.fsel{display:flex;flex-wrap:wrap;gap:8px}
.folder-tools{display:flex;flex-wrap:wrap;gap:0 16px;margin:-2px 0 8px}
.inline-form{display:flex;gap:8px;margin-bottom:2px}
.inline-form .in{flex:1;min-width:0}
.inline-form .btn{width:auto;flex:none;padding:0 18px;min-height:48px;font-size:16px}
.pick-bar{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:10px;font-size:14.5px;color:var(--muted)}
.btn.compact{width:auto;min-height:40px;padding:0 18px;font-size:15px;flex:none}
.check{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--grid-strong);display:grid;place-items:center;color:transparent}
.check svg{width:15px;height:15px}
.row.on .check{background:var(--cobalt);border-color:var(--cobalt);color:var(--cobalt-ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line-soft);border-radius:12px;padding:3px;margin-bottom:18px}
.seg button{border:0;background:none;border-radius:10px;min-height:40px;font-size:15px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.switch .hint{margin-top:2px}
.switch.field{padding:2px 0}
.scope-row{display:flex;align-items:center;gap:14px;margin:0 0 6px;min-height:40px}
.scope-sel{max-width:62%;font-family:var(--ui);font-size:15px;font-weight:600;color:var(--cobalt);background-color:var(--cobalt-soft);border:0;border-radius:999px;padding:7px 30px 7px 14px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--cobalt) 50%),linear-gradient(135deg,var(--cobalt) 50%,transparent 50%);background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}
.scope-label{font-size:15px;font-weight:600;color:var(--cobalt)}
.scope-row .undo{margin-left:auto}

/* vocabulary stats */
.vocab-num{font-size:42px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;margin:2px 0 6px;display:flex;align-items:baseline;gap:8px}
.vocab-num span{font-size:17px;font-weight:500;color:var(--muted)}
.fc.fc12,.fc-days.fc12{grid-template-columns:repeat(12,1fr)}
.fc .bar.past{opacity:.55}
.fc-days.fc12 span{white-space:nowrap;text-align:left}
.folder-stats{margin-top:18px;display:grid;gap:12px}
.fs-top{display:flex;justify-content:space-between;gap:12px;font-size:15px;font-weight:500}
.fs-top .muted{font-size:14px;font-weight:400;white-space:nowrap}
.fs-row .meter{margin:6px 0 0}
/* standard decks */
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.deck-intro{font-size:15px;color:var(--muted);margin:0 0 6px}
.deck-group{margin:24px 0 10px}
.deck{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.deck-main{flex:1;min-width:0}
.deck-name{font-size:16.5px;font-weight:600;line-height:1.35}
.deck-zh{font-family:var(--han);font-weight:500;color:var(--muted);font-size:15px;margin-left:4px;white-space:nowrap}
.deck-desc{font-size:14px;color:var(--muted);margin-top:2px}
.deck-meta{font-size:13px;color:var(--muted);margin-top:6px}
.deck .meter{height:6px;margin:6px 0 0}
.deck .btn.compact{flex:none}

/* automatic pinyin */
.lbl-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.link.mini{font-size:14px;padding:0 2px 6px}

/* choosing practice words */
.pick-tools{display:flex;align-items:center;flex-wrap:wrap;gap:4px 14px;margin:-2px 0 8px}

/* importing word lists */
.steps{margin:0 0 14px;padding-left:20px;font-size:15px;color:var(--muted)}
.steps li{margin-bottom:4px}
.imp-map{font-size:14px;margin:0 0 6px}
.imp-preview{margin-bottom:14px}

/* speaking practice */
.audio-row{flex-wrap:wrap}
.pill.rec,.chip.rec{border-color:var(--again);color:var(--again);background:var(--again-soft)}
.pill.rec svg,.chip.rec svg{color:var(--again);animation:pulse 1.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.pill.rec svg,.chip.rec svg{animation:none}}
.pa{margin:12px auto 0;max-width:420px;text-align:center;background:var(--paper);border:1px solid var(--line-soft);border-radius:14px;padding:12px 14px}
.ex-view .pa{grid-column:1 / -1;margin:8px 0 0;max-width:none}
.pa-top{display:flex;align-items:center;justify-content:center;gap:12px}
.pa-score{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.pa-score.ok{color:var(--easy)} .pa-score.mid{color:var(--hard)} .pa-score.bad{color:var(--again)}
.pa-sub{font-size:13px;color:var(--muted);text-align:left;max-width:16em}
.pa-words{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px}
.pa-w{display:inline-flex;flex-direction:column;align-items:center;border-radius:10px;padding:4px 8px;min-width:40px}
.pa-w b{font-family:var(--han);font-size:20px;font-weight:600;line-height:1.3}
.pa-w small{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.pa-w.ok{background:var(--easy-soft);color:var(--easy)} .pa-w.mid{background:var(--hard-soft);color:var(--hard)} .pa-w.bad{background:var(--again-soft);color:var(--again)}
.pa-heard{font-size:13.5px;color:var(--muted);margin-top:8px}
.pa-heard span{font-family:var(--han);color:var(--ink)}
.pa-tip{font-size:13.5px;margin-top:6px}
.pa-wait{font-size:14px;color:var(--muted)}
.pa-wait.err{color:var(--again)}
.pa-lvl{height:4px;max-width:160px;margin:10px auto 2px;border-radius:2px;background:var(--line-soft);overflow:hidden}
.pa-lvl i{display:block;height:100%;background:var(--cobalt);border-radius:2px;transform:scaleX(0);transform-origin:left center;transition:transform .08s linear}
@media (prefers-reduced-motion: reduce){.pa-lvl i{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="seal" lang="zh-CN" aria-hidden="true">记</span><span>Jìyì</span></div>
  <div class="top-actions">
  <button class="icon-btn" id="sync-btn" data-act="sync-now" data-state="off" aria-label="Sync now" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.2 18.5h10.3a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.5 9.4a4.6 4.6 0 0 0 .7 9.1z"/><path class="m-ok" d="M9.6 14l1.8 1.8 3.4-3.6"/><path class="m-err" d="M12 11.3v2.8M12 16.4h.01"/></svg>
  </button>
  <button class="icon-btn" id="opt-btn" data-act="tab" data-view="options" aria-label="Options">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
  </button>
  </div>
</header>
<main id="main"><div class="wrap">
  <section id="view-study" class="view" aria-label="Study"></section>
  <section id="view-add" class="view" aria-label="Add a card" hidden></section>
  <section id="view-cards" class="view" aria-label="Cards" hidden></section>
  <section id="view-stats" class="view" aria-label="Stats" hidden></section>
  <section id="view-options" class="view" aria-label="Options" hidden></section>
</div></main>
<div class="dock" id="dock">
  <div class="actions" id="actions"></div>
  <nav class="tabs" aria-label="Sections">
    <button class="tab" data-act="tab" data-view="study" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="7" width="13" height="13.5" rx="2.2"/><path d="M8 3.5h10.3a2.2 2.2 0 0 1 2.2 2.2V17"/></svg>Study</button>
    <button class="tab" data-act="tab" data-view="add">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 8v8M8 12h8"/></svg>Add</button>
    <button class="tab" data-act="tab" data-view="cards">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><path d="M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01" stroke-width="2.6"/></svg>Words</button>
    <button class="tab" data-act="tab" data-view="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20v-8M12 20V5M19 20v-5M3 20.5h18"/></svg>Stats</button>
  </nav>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Edit card" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept=".json,application/json,text/plain" hidden>
<input type="file" id="import-words-file" accept=".txt,.tsv,.csv,text/plain,text/csv,text/tab-separated-values" hidden>

<script src="app.js"></script>
</body>
</html>
